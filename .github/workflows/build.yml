name: Build desktop applications

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
            tags: ''
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
            tags: webkit2_41
          - os: macos-14
            platform: darwin/universal
            artifact: macos-universal
            tags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Check release version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo 'Tag must match VERSION' >&2
            exit 1
          fi
      - name: Build application
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          if [ -n "$BUILD_TAGS" ]; then
            wails build -clean -platform "$TARGET_PLATFORM" -tags "$BUILD_TAGS"
          else
            wails build -clean -platform "$TARGET_PLATFORM"
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "ToolboxSelf-v$version-windows-amd64.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path build/bin/ToolboxSelf.exe,LICENSE,README.md,CHANGELOG.md,docs -DestinationPath "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii "release/$name.sha256"
      - name: Package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p release/stage
          cp -R LICENSE README.md CHANGELOG.md docs release/stage/
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R build/bin/ToolboxSelf.app release/stage/
          else
            cp build/bin/ToolboxSelf release/stage/
            chmod +x release/stage/ToolboxSelf
          fi
          name="ToolboxSelf-v$version-$ARTIFACT_NAME.tar.gz"
          tar -czf "release/$name" -C release/stage .
          cd release
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToolboxSelf-${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
